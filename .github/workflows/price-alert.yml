name: Price Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Test proxy
        env:
          HTTP_PROXY_URL: ${{ secrets.HTTP_PROXY_URL }}
        run: |
          python - <<'PY'
          import os
          import requests

          proxy = os.environ.get("HTTP_PROXY_URL")
          proxies = {"http": proxy, "https": proxy} if proxy else None

          print("Proxy enabled:", "yes" if proxy else "no")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:126.0) Gecko/20100101 Firefox/126.0",
              "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
          }

          urls = [
              "https://api.ipify.org?format=json",
              "https://www.tudocelular.com/",
              "https://www.tudocelular.com/Motorola/precos/n9964/Motorola-Edge-60-Pro.html",
          ]

          for url in urls:
              try:
                  r = requests.get(url, headers=headers, proxies=proxies, timeout=30)
                  print(url)
                  print("STATUS:", r.status_code)
                  print("BODY:", r.text[:300].replace("\n", " "))
                  print()
              except Exception as e:
                  print(url)
                  print("ERROR:", e)
                  print()
          PY

      - name: Check prices
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          HTTP_PROXY_URL: ${{ secrets.HTTP_PROXY_URL }}
        run: python check_prices.py

      - name: Commit state
        run: |
          git config user.name "price-alert-bot"
          git config user.email "price-alert-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update price alert state"
          git push
